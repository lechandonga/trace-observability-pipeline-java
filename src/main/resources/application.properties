server.port=0

# ---- 链路追踪 ----
trace.sampling-rate=1.0
trace.max-cached-traces=1024
trace.max-spans-per-trace=256
trace.export-queue-capacity=4096
trace.export-file=./trace-export.jsonl

# 日志带上链路标识，方便按 traceId 直接查
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] [traceId=%X{traceId:-none} spanId=%X{spanId:-none}] %-5level %logger{36} - %msg%n
