server.port=0

# ---------- 轻量链路追踪配置 ----------
# 采样率 [0,1]，每条链路决策一次、全链路一致
tracing.sample-rate=1.0
# 内存中活动链路条数上限（超出后新链路整体不采样）
tracing.max-traces=1000
# 单条链路的 span 数上限（超出的 span 截断）
tracing.max-spans-per-trace=200
# 已结束链路在内存中保留时长（等待异步尾巴 span）
tracing.trace-retention-millis=30000
# 导出积压队列容量（span 条数），满后丢弃最新 span 并计数
tracing.export-queue-capacity=2000
tracing.export-batch-size=100
tracing.export-poll-timeout-millis=200
# 本地导出文件（JSON Lines），无需外部服务与凭据
tracing.export-file=trace-data/spans.jsonl

# 关键日志带上链路标识，可直接按 traceId 检索
logging.pattern.console=%d{HH:mm:ss.SSS} %-5level [%thread] [traceId=%X{traceId:-},spanId=%X{spanId:-}] %logger{36} - %msg%n
